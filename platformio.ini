; PlatformIO Project Configuration File for WiiM ESP32-S3 Touchscreen Remote
; Target Hardware: ESP32-S3 (N16R8: 16MB Flash, 8MB Octal OPI PSRAM)
; Display: 2.8" IPS TFT (ILI9341V, 240x320 SPI)
; Touch: FT6336G Capacitive I2C

[platformio]
default_envs = esp32-s3-wiim-remote

[env:esp32-s3-wiim-remote]
platform = espressif32 @ 7.1.2
board = esp32-s3-devkitc-1
framework = arduino

; Target 16MB Flash and 8MB Octal PSRAM (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
extra_scripts = post:scripts/merge_factory_bin.py

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Optimization and warning flags
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lovyan03/LovyanGFX @ 1.2.28
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ 7.4.3
